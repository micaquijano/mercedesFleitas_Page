<article class="product-card">
  <div class="product-image-container">
    <a [routerLink]="['/product', vestido().id]" [attr.aria-label]="'Ver detalle de ' + vestido().name" class="product-image-link">
      <img [src]="vestido().imageUrl" [alt]="'Vestido ' + vestido().name + ', ' + (vestido().collection ?? 'Atelier Mercedes Fleitas')" class="product-image">
    </a>

    <button
      type="button"
      class="favorite-toggle"
      [class.is-active]="isFavorite()"
      [attr.aria-pressed]="isFavorite()"
      [attr.aria-label]="(isFavorite() ? 'Quitar ' + vestido().name + ' de favoritos' : 'Agregar ' + vestido().name + ' a favoritos')"
      (click)="onToggleFavorite()">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
    </button>
  </div>

  <div class="product-info">
    <span class="product-collection">{{ vestido().collection }}</span>
    <h3 class="product-name">{{ vestido().name }}</h3>
    <p class="product-price">${{ vestido().price }}</p>
  </div>

  <div class="product-actions">
    <a class="view-details-btn" [routerLink]="['/product', vestido().id]" [attr.aria-label]="'Ver detalle de ' + vestido().name">
      Ver Detalle
    </a>
    <button
      type="button"
      class="add-to-cart-btn"
      [class.is-active]="isInCart()"
      [attr.aria-pressed]="isInCart()"
      [attr.aria-label]="(isInCart() ? 'Quitar ' + vestido().name + ' del carrito' : 'Agregar ' + vestido().name + ' al carrito')"
      (click)="onToggleCart()">
      {{ isInCart() ? 'En el Carrito' : 'Agregar al Carrito' }}
    </button>
  </div>
</article>
