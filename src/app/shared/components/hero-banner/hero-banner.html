<section class="hero-banner" [style.background-image]="'linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.45)), url(' + imageUrl() + ')'" role="img" [attr.aria-label]="title()">
  <div class="hero-content">
    @if (subtitle()) {
      <span class="hero-subtitle">{{ subtitle() }}</span>
    }
    <h1 class="hero-title">{{ title() }}</h1>
  </div>

  <a class="hero-cta" [routerLink]="ctaLink()" [fragment]="ctaFragment()">{{ ctaLabel() }}</a>
</section>
