<article class="catalog-view-container">
  <header class="editorial-header">
    <span class="brand-subtitle">Atelier Mercedes Fleitas</span>
    <h1 class="main-title">Mis Favoritos</h1>
  </header>

  @if (favoriteVestidos().length === 0) {
    <p class="empty-state">
      Todavía no agregaste vestidos a tus favoritos.
      <a routerLink="/catalog">Ver Catálogo</a>
    </p>
  } @else {
    <section class="catalog-grid" aria-label="Mis Favoritos">
      @for (vestido of favoriteVestidos(); track vestido.id) {
        <app-product-card [vestido]="vestido" />
      }
    </section>
  }
</article>
